name: Repository checks
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tests/check_repository.py
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python tests/smoke_test_model.py
      - run: python tests/test_portable_inference.py
      - run: python tests/test_strict_preprocessing.py
      - run: python tests/test_gnn_amp.py
      - run: python tests/test_matched_retrieval.py
      - run: python tests/test_profile_aggregation.py
      - run: python tests/test_training_objective.py
